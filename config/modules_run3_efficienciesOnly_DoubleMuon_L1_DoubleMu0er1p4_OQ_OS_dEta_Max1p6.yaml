#based of modules_onlymu.yaml, with many lines commented

# Golden-JSON lumisection mask (data only; MC passes through). First, so uncertified
# lumisections are dropped before any other module runs.
lumimask:
    name: DQCDLumiMaskRDF
    path: modules.lumi_mask
    parameters:
        isMC: self.dataset.process.isMC
        jsonFile: ${CMT_BASE}/../data/lumi/lumiMask_2024__Cert_Collisions2024_378981_386951_Golden.json

met:
    name: MetFilterRDF
    path: Base.Filters.METfilters
    parameters:
        isMC: self.dataset.process.isMC
        year: self.config.year

muon:
#    name: DQCDMuonSelectionRDF
    name: DQCDMuonSelection2024RDF_DoubleMuon_L1_DoubleMu0er1p4_OQ_OS_dEta_Max1p6
    path: modules.muon_selection
    parameters:
        year: self.config.year

muonsv:
    name: DQCDMuonSVSelectionRDF
    path: modules.muonsv_selection
    parameters:
        gen_mass: 2


fourmuonsv:
    name: DQCDFourMuonSVSelectionRDF
    path: modules.muonsv_selection


trig:
#    name: DQCDTriggerSelectionRDF
    name: DQCDTriggerSelection2024RDF
    path: modules.muonsv_selection
    parameters:
        gen_mass: 2

loose:
    name: DQCDLooseMuonSelectionRDF
    path: modules.muonsv_selection
    parameters:
        gen_mass: 2


# 2024 pileup weights (correctionlib): central LUM POG/CAT, Run3-24CDEReprocessingFGHIPrompt-Summer24-NanoAODv15
# (cvmfs cms-griddata .../cat/metadata/LUM/..., release 2026-04-15, identical to 2025-12-02). The same block, with the same file, is in
# config/weights_2024.yaml for PreCounter (normalisation denominators).
puweight:
    name: puWeightParkingRDF
    path: modules.puWeight
    parameters:
        isMC: self.dataset.process.isMC
        year: self.config.year
        isUL: self.config.get_aux('isUL', self.dataset.has_tag('ul'))
        fileName: ${CMT_BASE}/../data/pileup/puWeights_2024__Collisions24_BCDEFGHI_goldenJSON.json.gz
        corrName: Collisions24_BCDEFGHI_goldenJSON

