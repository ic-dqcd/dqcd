# Systematics for the 2024 Run-3 DQCD analysis.
#
# Structure mirrors systematics_UL18.cfg: one [section] per nuisance, `type = lnN`,
# then one line per process (or process group) with the multiplicative factor.
# Processes are matched by name, walking up parent_process if no direct match, so
# "signal" / "qcd" catch every child of those groups.
#
# ############################################################################
# EVERY NUMBER BELOW IS A PLACEHOLDER INHERITED FROM 2018 AND MUST BE REPLACED.
# They are kept only so the file parses and the machinery can be exercised; each
# is flagged with a TODO carrying what it depends on. Do not quote a limit made
# with this file until the TODOs are closed.
# ############################################################################

# TODO(lumi): 2024 luminosity uncertainty. The 2018 value (2.5%) is a Run-2
#   recommendation and does not apply. Take the Run-3 2024 number from the LUM POG
#   (PdmVLumi / LumiRecommendationsRun3) once published, and make sure it refers to the
#   SAME era set as config.lumi_pb (currently 109950 pb-1 for C-I) and as the per-era
#   pileup weights.
[lumi_13p6TeV_2024]
# https://twiki.cern.ch/twiki/bin/view/CMS/LumiRecommendationsRun3
type = lnN
signal                        = 1.025
qcd                           = 1.025

# TODO(theory): the three theory nuisances below are properties of the signal MODEL and
#   the 13.6 TeV cross section, not of the year's data. They may well carry over from
#   2018 unchanged, but that has to be checked against the 13.6 TeV ggH calculation
#   rather than assumed -- the 2018 values are for 13 TeV.
[QCDscale_ggH]
type = lnN
scenarioA = 1.039
scenarioB1 = 1.039
scenarioB2 = 1.039
scenarioC = 1.039
vector = 1.039
hzdzd = 1.039

[pdf_Higgs_gg]
type = lnN
scenarioA = 1.019
scenarioB1 = 1.019
scenarioB2 = 1.019
scenarioC = 1.019
vector = 1.019
hzdzd = 1.019

[alpha_s]
type = lnN
scenarioA = 1.026
scenarioB1 = 1.026
scenarioB2 = 1.026
scenarioC = 1.026
vector = 1.026
hzdzd = 1.026

# TODO(bdt): to be measured from the J/psi yield ratio, data vs QCD MC, before and after
#   the BDT selection (muonSV mass window 2.91-3.27 GeV). One value per SCENARIO, because
#   the BDT is retrained per scenario -- the SF is a property of the classifier, not of
#   the signal model. Must be measured on 2024 data + 2024 QCD; the 2018 numbers are
#   listed here only as the order of magnitude to expect:
#       2018 final (af6e5de): scenarioA 0.983 (syst 1.551)
#                             scenarioB1 0.690 (syst 1.063)
#                             vector     0.966 (syst 1.198)
#   The central VALUES go in modules/DQCD_SF.py (DQCDBDTSFRDFProducer); only the
#   uncertainty belongs in this file. Keep the two in step.
[bdt]
type = lnN
scenarioA = 1.10
scenarioB1 = 1.10
vector = 1.10

# TODO(xs): signal cross-section uncertainty at 13.6 TeV.
[xs]
type = lnN
btophi = 1.01

# TODO(missing): nuisances the 2024 analysis needs that 2018 did not have, or had
#   commented out. Add a section for each once the corresponding correction exists:
#     - pileup reweighting        (per-era central weights; see reference-2024-pileup-weights)
#     - muon ID scale factor      (2024 TnP, currently id_sf.json is TnP_2018)
#     - trigger scale factor      (2024 TnP, currently trigger_sf_alltriggers.json is 2018)
#     - prescale weight           (prescaleWeight.py is a Run-2 rewrite, not a number swap)
#   Each of these is already an open framework item; the systematic cannot be written
